<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniMax H3 · Talking Avatar</title>
<link rel="stylesheet" href="/extensions/ComfyUI-H3-LongVideo/h3lv.css">
<link rel="stylesheet" href="/extensions/ComfyUI-H3-LongVideo/talking_panel.css?v=pause-progress-20261028b">
<body><div class="h3talk-page">
<header class="h3lv-header h3talk-header">
  <div class="h3lv-title-row h3talk-standalone-title"><h2>MiniMax H3 · Talking Avatar</h2></div>
  <p id="state" class="h3lv-status" aria-live="polite">正在读取项目…</p><p id="overview-meta" class="h3lv-notice"></p><p id="error" class="h3talk-error" role="alert"></p>
  <div class="h3lv-actions"><button id="approve" class="h3lv-button primary" disabled>保存并确认</button><button id="reanalyze" class="h3lv-button" hidden>重新分析分段</button><button id="run" class="h3lv-button run" disabled>开始 / 继续生成</button><button id="pause" class="h3lv-button pause" disabled>当前段完成后暂停</button><button id="assemble" class="h3lv-button" disabled>仅重新合并</button><button id="reset-cuts" class="h3lv-button" hidden>撤销切点修改</button><button id="refresh" class="h3lv-button">刷新状态</button><button id="restore" class="h3lv-button" hidden>取消重做，恢复旧结果</button></div>
</header>
<main class="h3lv-content">
  <section class="h3lv-overview"><p class="h3lv-help">先试听，再拖动切点调整分段；保存并确认后生成。所有段共用同一张参考图。</p><p id="dirty" class="h3lv-notice"></p><canvas id="timeline" class="h3lv-timeline" tabindex="0"></canvas>
    <div class="h3lv-selected-bar"><div class="h3lv-selected-info"><span class="h3lv-chip neutral">原声</span><strong id="selected-audio-label">当前试听：第 1 段</strong></div><audio id="audio" controls preload="metadata"></audio></div>
    <details id="seam-review" class="h3talk-seams" hidden><summary id="seam-summary"></summary><ul id="seam-warnings"></ul></details>
  </section>
  <details class="h3lv-default-materials h3talk-reference"><summary class="h3lv-default-materials-header"><div class="h3lv-default-materials-title"><h3>项目参考图</h3><p class="h3lv-help">人物、背景与构图来自同一张图，整条口播复用。</p></div><span class="h3lv-default-materials-toggle">展开</span></summary><div class="h3lv-card-body h3talk-reference-body"><img id="reference" alt="项目主参考图"><div><p id="mask-note" class="h3lv-help"></p><img id="mask" alt="旧项目人物活动遮罩" hidden></div></div></details>
  <div id="cuts" class="h3lv-segments"></div><p id="regeneration-note" class="h3lv-notice"></p>
  <section id="result" class="h3lv-overview h3lv-result" hidden><div class="h3lv-result-header"><h3>完整成片</h3></div><p id="result-note" class="h3lv-notice"></p><video id="video" controls preload="metadata"></video></section>
  <details class="h3talk-settings"><summary>项目设置与生成参数</summary><p id="summary" class="h3lv-notice"></p><p id="project-path" class="h3lv-notice"></p></details>
  <section id="cloud-recovery" class="h3talk-settings"><details><summary>RH 异常任务恢复</summary><p class="h3lv-notice">仅创建结果未知时，核实RH任务列表后绑定已有任务ID。</p><div class="h3lv-actions"><input id="recover-index" type="number" min="1" value="1" aria-label="恢复段号"><input id="recover-id" placeholder="RH任务ID" aria-label="RH任务ID"><button id="recover" class="h3lv-button">绑定任务ID</button></div></details></section>
</main></div>
<script type="module" src="/h3talk/assets/talking_panel.js?v=auto-merge-20261029"></script></body></html>
